[project]
name = "backend"
version = "0.1.0"
description = "OptimusKG Real Graph Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
